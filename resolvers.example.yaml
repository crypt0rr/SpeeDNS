version: 1
resolvers:
  - id: example
    name: Example DNS
    owner: Example Corp
    policy: unfiltered
    # Each address is an IP literal (bare, bracketed, or zoned) or a
    # hostname. Never append a port here; ports belong in the per-transport
    # `port:` field below.
    addresses:
      - 192.0.2.53
    transports:
      udp:
        port: 53
      tcp:
        port: 53
      dot:
        server_name: dns.example
        port: 853
        bootstrap_addresses:
          - 192.0.2.53
      doh:
        url: https://dns.example/dns-query
        bootstrap_addresses:
          - 192.0.2.53
      doq:
        server_name: dns.example
        port: 853
        bootstrap_addresses:
          - 192.0.2.53
