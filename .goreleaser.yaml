version: 2
project_name: SpeeDNS

before:
  hooks:
    - go mod tidy

builds:
  - id: speedns
    main: ./cmd/speedns
    binary: speedns
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -buildid=
      - -X github.com/crypt0rr/SpeeDNS/internal/version.Version={{.Version}}
      - -X github.com/crypt0rr/SpeeDNS/internal/version.Commit={{.Commit}}
      - -X github.com/crypt0rr/SpeeDNS/internal/version.Date={{.CommitDate}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

nfpms:
  - id: deb
    package_name: speedns
    vendor: SpeeDNS contributors
    homepage: https://github.com/crypt0rr/SpeeDNS
    maintainer: SpeeDNS contributors
    description: Cross-platform DNS transport speed test CLI
    license: MIT
    formats: [deb]
    bindir: /usr/bin
    mtime: "{{ .CommitDate }}"

homebrew_casks:
  - repository:
      owner: crypt0rr
      name: homebrew-speedns
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    name: speedns
    homepage: https://github.com/crypt0rr/SpeeDNS
    description: Cross-platform DNS transport speed test CLI
    license: MIT
    binaries:
      - speedns
    url:
      verified: github.com/crypt0rr/SpeeDNS/releases/download

checksum:
  name_template: checksums.txt

signs:
  - artifacts: checksum
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --yes
      - --bundle=${signature}
      - ${artifact}

sboms:
  - artifacts: archive
    documents:
      - "{{ .ArtifactName }}.sbom.json"

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"

release:
  draft: true
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
