version: 2
project_name: SpeeDNS

before:
  hooks:
    - go mod tidy

builds:
  - id: speedns
    main: ./cmd/speedns
    binary: speedns
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    hooks:
      post:
        - cmd: ./scripts/normalize-build-mtime.sh {{ .Path }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -buildid=
      - -X github.com/crypt0rr/SpeeDNS/internal/version.Version={{.Version}}
      - -X github.com/crypt0rr/SpeeDNS/internal/version.Commit={{.Commit}}
      - -X github.com/crypt0rr/SpeeDNS/internal/version.Date={{.CommitDate}}

archives:
  - formats: [tar.gz]
    ids: [speedns]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds_info:
      owner: root
      group: root
      # A fixed archive member timestamp keeps tar headers reproducible.
      mtime: "2008-01-02T15:04:05Z"
    files:
      - src: LICENSE
        dst: LICENSE
        info:
          owner: root
          group: root
          mtime: "2008-01-02T15:04:05Z"
      - src: README.md
        dst: README.md
        info:
          owner: root
          group: root
          mtime: "2008-01-02T15:04:05Z"
      - src: docs/speedns.1
        dst: docs/speedns.1
        info:
          owner: root
          group: root
          mtime: "2008-01-02T15:04:05Z"

nfpms:
  - id: deb
    package_name: speedns
    vendor: SpeeDNS contributors
    homepage: https://github.com/crypt0rr/SpeeDNS
    maintainer: SpeeDNS contributors
    description: Cross-platform DNS transport speed test CLI
    license: MIT
    formats: [deb, rpm, apk, archlinux]
    bindir: /usr/bin
    mtime: "{{ .CommitDate }}"
    contents:
      - src: docs/speedns.1
        dst: /usr/share/man/man1/speedns.1
        file_info:
          mode: 0644

checksum:
  name_template: checksums.txt

signs:
  - artifacts: checksum
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --yes
      - --bundle=${signature}
      - ${artifact}

sboms:
  - id: archive
    artifacts: archive
    cmd: ../scripts/reproducible-syft.sh
    args:
      - $artifact
      - --output
      - spdx-json=$document
      - --enrich
      - all
    documents:
      - "{{ .ArtifactName }}.sbom.json"
  - id: package
    artifacts: package
    cmd: ../scripts/reproducible-syft.sh
    args:
      - $artifact
      - --output
      - spdx-json=$document
      - --enrich
      - all
    documents:
      - "{{ .ArtifactName }}.sbom.json"

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"

release:
  draft: true
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
