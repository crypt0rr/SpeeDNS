name: Publish Homebrew cask

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published stable vMAJOR.MINOR.PATCH tag
        required: true
        type: string
      allow_downgrade:
        description: Publish even if the tap already holds a newer version
        required: false
        default: false
        type: boolean

# One group for every run that can write the tap, not one per tag: the tap
# holds a single cask, so two runs for different releases must not interleave
# their read and write of it. GitHub keeps at most one run pending per group
# and cancels the older pending run when a newer one arrives. If the cancelled
# run was for the highest version, dispatch that tag again.
#
# Prerelease events get a group of their own. Concurrency applies to the whole
# run before the publish job's if: skips it, so in the shared group a
# prerelease published while a stable run waits would cancel that stable run
# and then do nothing, leaving its cask unpublished. A dispatch carries no
# release payload and always joins the shared group;
# validate-published-release.sh refuses a prerelease tag there.
concurrency:
  group: ${{ (github.event_name == 'release' && github.event.release.prerelease) && format('homebrew-prerelease-{0}', github.run_id) || 'homebrew-tap' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  publish:
    name: Publish Homebrew cask
    # Skip prereleases before the job asks the protected environment for
    # approval: the tap serves only stable releases, so such a run could only
    # wait for a reviewer and then fail. validate-published-release.sh still
    # refuses a prerelease, for dispatches and as a backstop. The event-name
    # clause admits dispatches, which carry no release payload.
    if: ${{ github.event_name != 'release' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    environment:
      name: release
    steps:
      - name: Check out release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Validate published release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/validate-published-release.sh "${RELEASE_TAG}" "${GITHUB_REPOSITORY}"

      - name: Validate Homebrew credential
        shell: bash
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${HOMEBREW_TAP_TOKEN}" ]]; then
            echo "HOMEBREW_TAP_TOKEN is missing; add it to the protected release environment" >&2
            exit 1
          fi

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download published checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_dir="${RUNNER_TEMP}/speedns-release"
          mkdir -p "${release_dir}"
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern checksums.txt \
            --pattern checksums.txt.sigstore.json \
            --dir "${release_dir}" \
            --clobber

      # Every sha256 in the cask comes from checksums.txt, and release assets
      # can be replaced after the release job signed them. Check the release
      # workflow's signature, with the identity README.md tells users to
      # require, before any of it reaches the tap.
      - name: Verify checksums signature
        shell: bash
        run: |
          set -euo pipefail
          release_dir="${RUNNER_TEMP}/speedns-release"
          cosign verify-blob "${release_dir}/checksums.txt" \
            --bundle "${release_dir}/checksums.txt.sigstore.json" \
            --certificate-identity-regexp '^https://github\.com/crypt0rr/SpeeDNS/\.github/workflows/release\.yml@refs/(tags/v[^/]+|heads/main)$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: Generate cask from published checksums
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/homebrew-cask.sh \
            "${RELEASE_TAG}" \
            "${RUNNER_TEMP}/speedns-release" \
            "${RUNNER_TEMP}/speedns.rb"

      - name: Publish Homebrew cask
        shell: bash
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # Passed through the environment, never interpolated into the script.
          # A release event has no inputs, so it is always 0 there.
          ALLOW_DOWNGRADE: ${{ inputs.allow_downgrade && '1' || '0' }}
        run: bash scripts/publish-homebrew-cask.sh "${RUNNER_TEMP}/speedns.rb" "${RELEASE_TAG}"

      - name: Validate published Homebrew tap
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/validate-homebrew-tap.sh "${RELEASE_TAG}"

      - name: Upload cask evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: speedns-homebrew-cask
          path: |
            ${{ runner.temp }}/speedns-release/checksums.txt
            ${{ runner.temp }}/speedns-release/checksums.txt.sigstore.json
            ${{ runner.temp }}/speedns.rb
          if-no-files-found: ignore
          retention-days: 14
