name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to release
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  actions: read
  artifact-metadata: write
  attestations: write
  contents: write
  id-token: write

env:
  GO_VERSION: '1.25.x'
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    environment:
      name: release
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          case "${RELEASE_TAG}" in
            v[0-9]*) ;;
            *)
              echo "release ref must be a v* tag, got ${RELEASE_TAG}" >&2
              exit 1
              ;;
          esac
          checked_out_tag="$(git describe --tags --exact-match HEAD 2>/dev/null || true)"
          if [[ "${checked_out_tag}" != "${RELEASE_TAG}" ]]; then
            echo "${RELEASE_TAG} does not resolve to the checked-out commit" >&2
            exit 1
          fi

      - name: Validate release credentials
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "GITHUB_TOKEN is unavailable to the release job" >&2
            exit 1
          fi

      - name: Set reproducible package timestamp
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify module metadata
        shell: bash
        run: |
          set -euo pipefail
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify

      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(find . -type f -name '*.go' -exec gofmt -l {} +)"
          test -z "${unformatted}" || {
            echo "unformatted Go files:" >&2
            printf '%s\n' "${unformatted}" >&2
            exit 1
          }

      - name: Run release preflight tests
        run: go test -count=1 ./...

      - name: Run release preflight vet
        run: go vet ./...

      - name: Run release preflight race tests
        run: go test -count=1 -race ./...

      - name: Enforce 100% statement coverage
        run: bash scripts/coverage.sh

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install Linux package inspection tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes rpm zstd

      - name: Build reproducibility reference
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: 'v2.17.1'
          args: release --snapshot --clean --skip=publish --skip=sign

      - name: Save reproducibility reference
        shell: bash
        run: cp -a dist "${RUNNER_TEMP}/speedns-repro-reference"

      - name: Build reproducibility candidate
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: 'v2.17.1'
          args: release --snapshot --clean --skip=publish --skip=sign

      - name: Compare reproducibility artifacts
        shell: bash
        run: bash scripts/compare-release-artifacts.sh "${RUNNER_TEMP}/speedns-repro-reference" dist

      - name: Test release scripts fixture
        shell: bash
        run: bash scripts/release-fixture.sh

      - name: Build release artifacts once
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: 'v2.17.1'
          args: release --clean --skip=publish
        env:
          COSIGN_YES: 'true'

      - name: Verify and smoke-test exact release assets
        shell: bash
        run: |
          set -euo pipefail
          : >dist/release-smoke.log
          {
            bash scripts/release-assets.sh verify dist dist/release-assets.txt
            bash scripts/artifact-smoke.sh linux dist dist/release-assets.txt
            bash scripts/artifact-smoke.sh macos-archives dist dist/release-assets.txt
            bash scripts/homebrew-cask.sh "${RELEASE_TAG}" dist dist/speedns.rb
          } 2>&1 | tee dist/release-smoke.log

      - name: Upload release verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: speedns-release-verification
          path: |
            dist/artifacts.json
            dist/checksums.txt
            dist/release-assets.txt
            dist/release-smoke.log
            dist/speedns.rb
          if-no-files-found: ignore
          retention-days: 30

      - name: Ensure GitHub release draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -f dist/CHANGELOG.md ]]; then
            bash scripts/ensure-release.sh "${RELEASE_TAG}" dist/CHANGELOG.md
          else
            bash scripts/ensure-release.sh "${RELEASE_TAG}"
          fi

      - name: Upload exact release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t release_assets <dist/release-assets.txt
          test "${#release_assets[@]}" -gt 0
          gh release upload "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber \
            "${release_assets[@]}"

      - name: Attest published release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
