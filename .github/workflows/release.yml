name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH[-PRERELEASE] tag to release
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Read-only unless a job says otherwise. GitHub grants permissions per job, and
# any code that runs in a job holding id-token: write can mint a signature that
# passes the identity README.md tells users to require, from whichever step it
# runs in. So the tests, the fixtures and every run of a built binary happen in
# the verify job, which can sign nothing. The publish job alone signs, attests
# and writes, and it only builds, compares and uploads.
# schema/workflows_test.go holds the jobs to that split.
permissions:
  contents: read

env:
  GO_VERSION: '1.26.x'
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  # A stable tag can point to the same commit as its final prerelease. Tell
  # GoReleaser which tag is being published instead of relying on git
  # describe's choice among multiple tags on that commit.
  GORELEASER_CURRENT_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
      go-version: ${{ steps.go.outputs.go-version }}
      previous-tag: ${{ steps.previous-tag.outputs.tag }}
    steps:
      # Neither job pushes, so neither keeps the token in .git/config, where
      # every later step, the tests included, could read it.
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          # The shape every release script requires (scripts/homebrew-cask.sh
          # explains why), checked here as well so a malformed tag fails before
          # either GoReleaser build rather than after both. The C locale keeps
          # [0-9] to the ASCII digits. schema/workflows_test.go keeps this
          # copy identical to the scripts' copies.
          valid_release_tag() {
            local LC_ALL=C
            [[ "$1" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          }
          if ! valid_release_tag "${RELEASE_TAG}"; then
            echo "release ref must be a vMAJOR.MINOR.PATCH[-PRERELEASE] tag, got ${RELEASE_TAG}" >&2
            exit 1
          fi
          # Membership, not identity: several tags can point at one commit (a
          # stable tag on the same commit as its final prerelease), and
          # `git describe --exact-match` returns only one of them, chosen by
          # rules that have nothing to do with which tag is being released.
          if ! git tag --points-at HEAD | grep -Fqx -- "${RELEASE_TAG}"; then
            echo "${RELEASE_TAG} does not resolve to the checked-out commit" >&2
            echo "tags at HEAD: $(git tag --points-at HEAD | tr '\n' ' ')" >&2
            exit 1
          fi

      # The publish job builds this commit and no other, since the tag can be
      # moved while publish waits for approval. Recorded before any of the
      # tag's code runs, so none of it can change the record.
      - name: Record the verified commit
        id: commit
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      # Chosen here, before the tests and the publish job's approval, so a tag
      # that cannot choose its range fails in minutes rather than after both.
      # The publish job's build reads the choice from this step's output.
      - name: Select the previous tag for release notes
        id: previous-tag
        shell: bash
        run: |
          set -euo pipefail
          # GoReleaser defaults the changelog range to the nearest reachable
          # tag, prereleases included. A stable tag cut after a release
          # candidate would therefore publish notes covering only rc..stable
          # and silently omit everything the candidate shipped. For a stable
          # tag, compare against the previous STABLE tag instead; a prerelease
          # keeps the default, where rc-to-rc is the useful range.
          if [[ "${RELEASE_TAG}" == *-* ]]; then
            echo "prerelease ${RELEASE_TAG}: keeping GoReleaser's default range"
            exit 0
          fi
          # The previous stable tag is the highest one BELOW this release, not
          # the highest overall: a backport such as v0.5.3 cut after v0.6.1
          # must be measured from v0.5.2. scripts/release-fixture.sh covers it.
          #
          # The script comes from the checked-out tag, like every script this
          # job runs, while a dispatch runs this file from the branch it was
          # started on. Dispatched from main, a tag whose tree predates the
          # script (any tag up to v0.6.8, or one cut from a maintenance branch
          # that has not cherry-picked it) would stop here with a bare exit 127.
          if [[ ! -f scripts/previous-stable-tag.sh ]]; then
            echo "${RELEASE_TAG} has no scripts/previous-stable-tag.sh, which this workflow needs to choose the release notes range." >&2
            echo "Cherry-pick the script and this step onto the branch before tagging; see \"Backport releases\" in RELEASE_CHECKLIST.md." >&2
            exit 1
          fi
          previous="$(git tag --list 'v*' | bash scripts/previous-stable-tag.sh "${RELEASE_TAG}")"
          if [[ -z "${previous}" ]]; then
            echo "no earlier stable tag: keeping GoReleaser's default range"
            exit 0
          fi
          echo "stable ${RELEASE_TAG}: notes will cover ${previous}..${RELEASE_TAG}"
          echo "GORELEASER_PREVIOUS_TAG=${previous}" >> "${GITHUB_ENV}"
          echo "tag=${previous}" >> "${GITHUB_OUTPUT}"

      - name: Set reproducible package timestamp
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      # No cache, deliberately, here and in the publish job. A tag or dispatch
      # run can restore the setup-go cache that main-branch CI, CodeQL and the
      # scheduled live smoke save, and nothing checks what it restores: `go mod
      # verify` covers the module cache only, and GOCACHE entries are trusted
      # as written. Restored into both builds, a planted entry would reach the
      # reference and the signed artifacts alike, and the comparison between
      # them could not see it. A cold build costs a few minutes per release.
      - name: Set up Go
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Verify module metadata
        shell: bash
        run: |
          set -euo pipefail
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify

      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(find . -type f -name '*.go' -exec gofmt -l {} +)"
          test -z "${unformatted}" || {
            echo "unformatted Go files:" >&2
            printf '%s\n' "${unformatted}" >&2
            exit 1
          }

      - name: Run release preflight tests
        run: go test -count=1 ./...

      - name: Run release preflight vet
        run: go vet ./...

      - name: Run release preflight race tests
        run: go test -count=1 -race ./...

      - name: Enforce 100% statement coverage
        run: bash scripts/coverage.sh

      - name: Test release scripts fixture
        shell: bash
        run: bash scripts/release-fixture.sh

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

      # Build the release tag's own artifacts, unsigned, as the reproducibility
      # reference. This is deliberately not a --snapshot build: a snapshot
      # carries a different version string, so comparing two snapshots proves
      # only that two throwaway builds agree, never that the artifacts the
      # publish job goes on to sign are reproducible. Nothing built here is
      # published: the publish job uploads its own build, and only after
      # checking that it is byte-identical to this one.
      - name: Build reproducibility reference
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: 'v2.18.3'
          args: release --clean --skip=publish --skip=sign

      # Installed after the reference build, so that it runs with the same
      # tools as the publish job's build: only the smoke tests need these.
      - name: Install Linux package inspection tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes rpm zstd

      # The publish job proves that its archives, packages, SBOMs and
      # checksums.txt are byte-identical to these before it uploads anything,
      # so running these binaries here covers the published ones without ever
      # executing a build where the OIDC token is available.
      - name: Verify and smoke-test reference release assets
        shell: bash
        run: |
          set -euo pipefail
          : >dist/release-smoke.log
          {
            bash scripts/release-assets.sh verify dist dist/release-assets.txt
            bash scripts/artifact-smoke.sh linux dist dist/release-assets.txt
            bash scripts/artifact-smoke.sh macos-archives dist dist/release-assets.txt
            bash scripts/homebrew-cask.sh "${RELEASE_TAG}" dist dist/speedns.rb
          } 2>&1 | tee dist/release-smoke.log

      - name: Upload release smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: speedns-release-smoke
          path: |
            dist/artifacts.json
            dist/checksums.txt
            dist/release-assets.txt
            dist/release-smoke.log
            dist/speedns.rb
          if-no-files-found: ignore
          retention-days: 30

      # Exactly the files scripts/compare-release-artifacts.sh hashes. Kept as
      # long as the evidence: the publish job reads it only once the release
      # environment is approved, and a review can wait for days.
      - name: Upload reproducibility reference
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: speedns-repro-reference
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/*.pkg.tar.zst
            dist/*.sbom.json
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Sign and publish release
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      # The verify job tested one commit; build and sign that one. Approval can
      # come long after verification, and a tag moved in between would
      # otherwise be signed untested.
      - name: Confirm the tag still names the verified commit
        shell: bash
        env:
          VERIFIED_COMMIT: ${{ needs.verify.outputs.commit }}
        run: |
          set -euo pipefail
          checked_out="$(git rev-parse HEAD)"
          if [[ "${checked_out}" != "${VERIFIED_COMMIT}" ]]; then
            echo "${RELEASE_TAG} resolves to ${checked_out}, but the verify job tested ${VERIFIED_COMMIT:-no commit}" >&2
            exit 1
          fi
          if ! git tag --points-at HEAD | grep -Fqx -- "${RELEASE_TAG}"; then
            echo "${RELEASE_TAG} does not resolve to the checked-out commit" >&2
            echo "tags at HEAD: $(git tag --points-at HEAD | tr '\n' ' ')" >&2
            exit 1
          fi

      - name: Validate release credentials
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "GITHUB_TOKEN is unavailable to the publish job" >&2
            exit 1
          fi

      - name: Set reproducible package timestamp
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      # The exact Go release the reference was built with, not GO_VERSION's
      # range: two runners can resolve 1.26.x to different patch releases
      # (each runner image preinstalls its own, and a release can land while
      # this job waits for approval), and the comparison below would then
      # fail on the toolchain rather than on the code. No cache, for the
      # reasons given in the verify job.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ needs.verify.outputs.go-version }}
          cache: false

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download reproducibility reference
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: speedns-repro-reference
          path: ${{ runner.temp }}/speedns-repro-reference

      - name: Build release artifacts once
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: 'v2.18.3'
          args: release --clean --skip=publish
        env:
          COSIGN_YES: 'true'
          # Empty for a prerelease or a first release, which GoReleaser reads
          # as unset and so keeps its default range.
          GORELEASER_PREVIOUS_TAG: ${{ needs.verify.outputs.previous-tag }}

      # Compare what is about to be published against the reference the verify
      # job built from the same commit on another runner: a fresh machine with
      # a cold build cache and the same pinned tools. A difference means the
      # build depends on something besides the commit and those tools, such as
      # a planted cache entry, the runner or the network, and nothing is
      # uploaded. compare-release-artifacts.sh hashes archives, packages, SBOMs
      # and checksums.txt only, so the signing step's extra files do not
      # affect it and checksums.txt itself is unchanged by signing.
      - name: Verify the published artifacts are reproducible
        shell: bash
        run: bash scripts/compare-release-artifacts.sh "${RUNNER_TEMP}/speedns-repro-reference" dist

      - name: Verify exact release assets
        shell: bash
        run: bash scripts/release-assets.sh verify dist dist/release-assets.txt

      - name: Upload release verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: speedns-release-verification
          path: |
            dist/artifacts.json
            dist/checksums.txt
            dist/release-assets.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Ensure GitHub release draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -f dist/CHANGELOG.md ]]; then
            bash scripts/ensure-release.sh "${RELEASE_TAG}" dist/CHANGELOG.md
          else
            bash scripts/ensure-release.sh "${RELEASE_TAG}"
          fi

      - name: Upload exact release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t release_assets <dist/release-assets.txt
          test "${#release_assets[@]}" -gt 0
          gh release upload "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber \
            "${release_assets[@]}"

      - name: Attest published release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
