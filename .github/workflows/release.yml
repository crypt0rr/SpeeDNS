name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to release
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  actions: read
  artifact-metadata: write
  attestations: write
  contents: write
  id-token: write

env:
  GO_VERSION: '1.25.x'
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    environment:
      name: release
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          case "${RELEASE_TAG}" in
            v[0-9]*) ;;
            *)
              echo "release ref must be a v* tag, got ${RELEASE_TAG}" >&2
              exit 1
              ;;
          esac
          checked_out_tag="$(git describe --tags --exact-match HEAD 2>/dev/null || true)"
          if [[ "${checked_out_tag}" != "${RELEASE_TAG}" ]]; then
            echo "${RELEASE_TAG} does not resolve to the checked-out commit" >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify module metadata
        shell: bash
        run: |
          set -euo pipefail
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify

      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(find . -type f -name '*.go' -exec gofmt -l {} +)"
          test -z "${unformatted}" || {
            echo "unformatted Go files:" >&2
            printf '%s\n' "${unformatted}" >&2
            exit 1
          }

      - name: Run release preflight tests
        run: go test -count=1 ./...

      - name: Run release preflight vet
        run: go vet ./...

      - name: Run release preflight race tests
        run: go test -count=1 -race ./...

      - name: Enforce 100% statement coverage
        run: bash scripts/coverage.sh

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build release candidate snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean --skip=sign

      - name: Smoke-test release candidate artifacts
        shell: bash
        run: |
          bash scripts/artifact-smoke.sh linux dist
          bash scripts/artifact-smoke.sh macos-archives dist

      - name: Build and publish GitHub release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          COSIGN_YES: 'true'

      - name: Attest published release artifacts
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: dist/checksums.txt
