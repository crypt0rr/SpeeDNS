name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: '1.25.x'

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(find . -type f -name '*.go' -exec gofmt -l {} +)"
          if [[ -n "${unformatted}" ]]; then
            echo 'The following Go files are not gofmt-formatted:'
            printf '%s\n' "${unformatted}"
            exit 1
          fi

      - name: Verify module metadata
        shell: bash
        run: |
          set -euo pipefail
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify

      - name: Test domain corpus updater fixture
        shell: bash
        run: bash scripts/update-domains-fixture.sh

      - name: Run unit and integration tests
        run: go test -count=1 ./...

      - name: Run go vet
        run: go vet ./...

      - name: Run race detector
        run: go test -count=1 -race ./...

      - name: Enforce 100% statement coverage
        env:
          COVERAGE_OUTPUT: ${{ runner.temp }}/speedns.coverprofile
        run: bash scripts/coverage.sh

      - name: Upload coverage profile
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-${{ matrix.os }}
          path: ${{ runner.temp }}/speedns.coverprofile
          if-no-files-found: error
          retention-days: 14

  cross-build:
    name: Cross-build release targets
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build release targets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            IFS=/ read -r goos goarch <<< "${target}"
            output="dist/speedns-${goos}-${goarch}"
            echo "building ${goos}/${goarch}"
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" \
              go build -trimpath -o "${output}" ./cmd/speedns
          done
          ./dist/speedns-linux-amd64 version
          ls -lh dist

      - name: Upload cross-build binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: speedns-cross-builds
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release-check:
    name: Validate GoReleaser snapshot
    needs:
      - test
      - cross-build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

      - name: Build GoReleaser snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean --skip=sign

      - name: Smoke-test Linux archive and Debian package
        shell: bash
        run: bash scripts/artifact-smoke.sh linux dist

      - name: Validate macOS archive contents
        shell: bash
        run: bash scripts/artifact-smoke.sh macos-archives dist

      - name: Upload GoReleaser snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: speedns-goreleaser-snapshot
          path: dist/
          if-no-files-found: error
          retention-days: 14

  native-macos-smoke:
    name: Native macOS artifact smoke
    needs: release-check
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download GoReleaser snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: speedns-goreleaser-snapshot
          path: dist

      - name: Execute native macOS artifact
        shell: bash
        run: bash scripts/artifact-smoke.sh macos dist
