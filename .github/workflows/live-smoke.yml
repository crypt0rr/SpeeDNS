name: Live DNS smoke

# This is scheduled/manual only, so failures signal public health without
# gating ordinary pull requests.
on:
  schedule:
    - cron: '17 03 * * 1'
  workflow_dispatch:

concurrency:
  group: live-dns-smoke
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: '1.26.x'

jobs:
  smoke:
    name: Public endpoint smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build smoke-test binary
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go build -trimpath -o "${RUNNER_TEMP}/speedns" ./cmd/speedns

      - name: Test one official endpoint per transport
        shell: bash
        run: |
          set -euo pipefail
          SPEEDNS_BINARY="${RUNNER_TEMP}/speedns" \
          SPEEDNS_SMOKE_DIR="${RUNNER_TEMP}/speedns-smoke" \
          SPEEDNS_SMOKE_ATTEMPTS=3 \
          SPEEDNS_SMOKE_RETRY_DELAY=5 \
          bash scripts/live-smoke.sh

      - name: Upload smoke-test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: speedns-live-smoke
          path: ${{ runner.temp }}/speedns-smoke/
          if-no-files-found: ignore
          retention-days: 14

      - name: Report smoke status
        if: always()
        shell: bash
        run: |
          if [[ -s "${RUNNER_TEMP}/speedns-smoke/failures.txt" ]]; then
            cat "${RUNNER_TEMP}/speedns-smoke/failures.txt" >&2
            exit 1
          fi

  publish:
    name: Publish live results
    if: ${{ always() && needs.smoke.result != 'cancelled' }}
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The token can write the whole repository, and only the final push
      # needs it. Persisted in .git/config it would be readable by every step
      # in between, the results generator included, so the push is handed the
      # token for that one command instead.
      - name: Check out source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download smoke-test evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: speedns-live-smoke
          path: ${{ runner.temp }}/speedns-smoke

      - name: Prepare results branch worktree
        shell: bash
        run: |
          set -euo pipefail
          worktree="${RUNNER_TEMP}/speedns-results"
          git fetch origin refs/heads/results:refs/remotes/origin/results || true
          if git show-ref --verify --quiet refs/remotes/origin/results; then
            git worktree add --detach "${worktree}" origin/results
          else
            git worktree add --detach "${worktree}" "${GITHUB_SHA}"
            git -C "${worktree}" switch --orphan results
            git -C "${worktree}" rm -rf -- . >/dev/null 2>&1 || true
          fi
          echo "SPEEDNS_RESULTS_DIR=${worktree}" >> "${GITHUB_ENV}"

      - name: Validate and generate results site
        run: |
          python3 scripts/publish-live-results.py \
            --evidence-dir "${RUNNER_TEMP}/speedns-smoke" \
            --output-dir "${SPEEDNS_RESULTS_DIR}"

      - name: Commit and push results branch
        shell: bash
        env:
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git -C "${SPEEDNS_RESULTS_DIR}" config user.name "github-actions[bot]"
          git -C "${SPEEDNS_RESULTS_DIR}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "${SPEEDNS_RESULTS_DIR}" add -- index.html latest.json live-results-v1.schema.json runs .nojekyll
          if git -C "${SPEEDNS_RESULTS_DIR}" diff --cached --quiet; then
            echo "results branch is already current"
            exit 0
          fi
          git -C "${SPEEDNS_RESULTS_DIR}" commit -m "Publish live DNS results for ${GITHUB_RUN_ID}"
          # The same header actions/checkout would have persisted, given to this
          # one git process through its environment: never written to
          # .git/config and never on a command line. Actions masks the token
          # but not its base64 form, so that is masked here.
          credential="$(printf 'x-access-token:%s' "${PUSH_TOKEN}" | base64 | tr -d '\n')"
          echo "::add-mask::${credential}"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader" \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${credential}" \
            git -C "${SPEEDNS_RESULTS_DIR}" push origin HEAD:results
