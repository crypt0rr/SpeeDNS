name: Go security

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '23 03 * * 5'
  workflow_dispatch:

concurrency:
  group: go-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  govulncheck:
    name: Run govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Run Go vulnerability scan
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          go-version-input: '1.25.x'
          go-package: ./...
